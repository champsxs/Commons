services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: commons
      POSTGRES_DB: commons
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commons"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: commons
      MINIO_ROOT_PASSWORD: commons-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
  miniodata:
